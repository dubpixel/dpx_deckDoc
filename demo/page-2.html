<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dpx_deckDoc</title>
<link rel="icon" href="dubbug_favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dpx-topbar">
  <img src="dubpixel_identicon.png" alt="dubpixel" height="18">
  <span class="dpx-version">v0.9.2</span>
  <a href="https://github.com/dubpixel/dpx_deckDoc" target="_blank" rel="noopener">GitHub</a>
  <span class="dpx-git">fix/classic-grid-async-bitmap-wait @ fd37d1d</span>
</div>
<main>

        <a href="index.html">&larr; all pages</a>
        <h1>Page 2 — Camera Switching</h1>
        <div class="frame">
          <div class="side-panel" id="side-panel">
            <p class="empty-hint">Hover a button to see its annotation.</p>
          </div>
          <div class="deck-wrap">
            <div class="deck" id="deck" style="grid-template-columns:repeat(8,96px);grid-template-rows:repeat(4,96px)">
        <div class="btn" style="grid-row:1;grid-column:1" data-loc="0/0"     >
          <img src="images/2-0-0.svg" alt="button 0/0">
          
        </div>

        <div class="btn" style="grid-row:1;grid-column:2" data-loc="0/1"     >
          <img src="images/2-0-1.svg" alt="button 0/1">
          
        </div>

        <div class="btn" style="grid-row:1;grid-column:3" data-loc="0/2"     >
          <img src="images/2-0-2.svg" alt="button 0/2">
          
        </div>

        <div class="btn" style="grid-row:1;grid-column:4" data-loc="0/3"     >
          <img src="images/2-0-3.svg" alt="button 0/3">
          
        </div>

        <div class="btn" style="grid-row:1;grid-column:5" data-loc="0/4"     >
          <img src="images/2-0-4.svg" alt="button 0/4">
          
        </div>

        <div class="btn" style="grid-row:1;grid-column:6" data-loc="0/5"     >
          <img src="images/2-0-5.svg" alt="button 0/5">
          
        </div>

        <div class="btn" style="grid-row:1;grid-column:7" data-loc="0/6"     >
          <img src="images/2-0-6.svg" alt="button 0/6">
          
        </div>

        <div class="btn" style="grid-row:1;grid-column:8" data-loc="0/7"     >
          <img src="images/2-0-7.svg" alt="button 0/7">
          
        </div>

        <div class="btn" style="grid-row:2;grid-column:1" data-loc="1/0"     >
          <img src="images/2-1-0.svg" alt="button 1/0">
          
        </div>

        <div class="btn" style="grid-row:2;grid-column:2" data-loc="1/1"     >
          <img src="images/2-1-1.svg" alt="button 1/1">
          
        </div>

        <div class="btn" style="grid-row:2;grid-column:3" data-loc="1/2"     >
          <img src="images/2-1-2.svg" alt="button 1/2">
          
        </div>

        <div class="btn" style="grid-row:2;grid-column:4" data-loc="1/3"     >
          <img src="images/2-1-3.svg" alt="button 1/3">
          
        </div>

        <div class="btn" style="grid-row:2;grid-column:5" data-loc="1/4"     >
          <img src="images/2-1-4.svg" alt="button 1/4">
          
        </div>

        <div class="btn" style="grid-row:2;grid-column:6" data-loc="1/5" data-heading="Overlay Toggle" data-body="Shows/hides the vMix overlay channel used for sponsor bugs."   data-command="vMix: OverlayInput1In">
          <img src="images/2-1-5.svg" alt="button 1/5">
          
        </div>

        <div class="btn" style="grid-row:2;grid-column:7" data-loc="1/6"     >
          <img src="images/2-1-6.svg" alt="button 1/6">
          
        </div>

        <div class="btn" style="grid-row:2;grid-column:8" data-loc="1/7"     >
          <img src="images/2-1-7.svg" alt="button 1/7">
          
        </div>

        <div class="btn" style="grid-row:3;grid-column:1" data-loc="2/0"     >
          <img src="images/2-2-0.svg" alt="button 2/0">
          
        </div>

        <div class="btn" style="grid-row:3;grid-column:2" data-loc="2/1"     >
          <img src="images/2-2-1.svg" alt="button 2/1">
          
        </div>

        <div class="btn" style="grid-row:3;grid-column:3" data-loc="2/2"     >
          <img src="images/2-2-2.svg" alt="button 2/2">
          
        </div>

        <div class="btn" style="grid-row:3;grid-column:4" data-loc="2/3"     >
          <img src="images/2-2-3.svg" alt="button 2/3">
          
        </div>

        <div class="btn" style="grid-row:3;grid-column:5" data-loc="2/4"     >
          <img src="images/2-2-4.svg" alt="button 2/4">
          
        </div>

        <div class="btn" style="grid-row:3;grid-column:6" data-loc="2/5"     >
          <img src="images/2-2-5.svg" alt="button 2/5">
          
        </div>

        <div class="btn" style="grid-row:3;grid-column:7" data-loc="2/6"     >
          <img src="images/2-2-6.svg" alt="button 2/6">
          
        </div>

        <div class="btn" style="grid-row:3;grid-column:8" data-loc="2/7"     >
          <img src="images/2-2-7.svg" alt="button 2/7">
          
        </div>

        <div class="btn" style="grid-row:4;grid-column:1" data-loc="3/0"     >
          <img src="images/2-3-0.svg" alt="button 3/0">
          
        </div>

        <div class="btn" style="grid-row:4;grid-column:2" data-loc="3/1"     >
          <img src="images/2-3-1.svg" alt="button 3/1">
          
        </div>

        <div class="btn" style="grid-row:4;grid-column:3" data-loc="3/2"     >
          <img src="images/2-3-2.svg" alt="button 3/2">
          
        </div>

        <div class="btn" style="grid-row:4;grid-column:4" data-loc="3/3"     >
          <img src="images/2-3-3.svg" alt="button 3/3">
          
        </div>

        <div class="btn" style="grid-row:4;grid-column:5" data-loc="3/4"     >
          <img src="images/2-3-4.svg" alt="button 3/4">
          
        </div>

        <div class="btn" style="grid-row:4;grid-column:6" data-loc="3/5"     >
          <img src="images/2-3-5.svg" alt="button 3/5">
          
        </div>

        <div class="btn" style="grid-row:4;grid-column:7" data-loc="3/6"     >
          <img src="images/2-3-6.svg" alt="button 3/6">
          
        </div>

        <div class="btn" style="grid-row:4;grid-column:8" data-loc="3/7" data-heading="All Stop" data-body="Kills every running OSC cue across all connections — the panic button." data-notice="Use only if a cue is stuck or misfiring; this does not just pause, it stops everything."  data-command="OSC: /allstop">
          <img src="images/2-3-7.svg" alt="button 3/7">
          
        </div></div>
          </div>
        </div>
      
</main>
<script src="viewer.js"></script>
